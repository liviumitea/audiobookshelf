apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audibookshelf-metadata-pvc
  namespace: audibookshelf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
  volumeName: "audibookshelf-metadata-pv"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audibookshelf-config-pvc
  namespace: audibookshelf 
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: "audibookshelf-config-pv"
